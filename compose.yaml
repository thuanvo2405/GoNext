services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gonext}
      POSTGRES_USER: ${POSTGRES_USER:-gonext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gonext_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
